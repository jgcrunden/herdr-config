onboarding = false

[ui]
sidebar_start_collapsed = true

[keys]
prefix = "ctrl+a"
focus_pane_left = ""
focus_pane_down = ""
focus_pane_up = ""
focus_pane_right = ""
navigate_workspace_up = "k"
navigate_workspace_down = "j"

[[keys.command]]
key = "prefix+shift+n"
type = "plugin_action"
command = "herdr-workspace.open"
description = "New workspace from layout profile"

[[keys.command]]
key = "prefix+shift+w"
type = "plugin_action"
command = "herdr-workspace.worktree"
description = "New worktree from layout profile"

[[keys.command]]
key = "ctrl+h"
type = "plugin_action"
command = "local.vim-navigator.left"
description = "Vim-aware pane left"

[[keys.command]]
key = "ctrl+j"
type = "plugin_action"
command = "local.vim-navigator.down"
description = "Vim-aware pane down"

[[keys.command]]
key = "ctrl+k"
type = "plugin_action"
command = "local.vim-navigator.up"
description = "Vim-aware pane up"

[[keys.command]]
key = "ctrl+l"
type = "plugin_action"
command = "local.vim-navigator.right"
description = "Vim-aware pane right"
